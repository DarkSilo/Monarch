openapi: 3.1.0
info:
  title: Monarch Inventory API
  version: 1.0.0
  description: Complete inventory, cart, wishlist, and order API for Monarch.

servers:
  - url: http://localhost:8082
    description: Inventory service (direct)
  - url: http://localhost:8080/inventory
    description: Via API gateway

tags:
  - name: Health
  - name: Inventory
  - name: Cart
  - name: Wishlist
  - name: Orders

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: Healthy service

  /:
    get:
      tags: [Inventory]
      summary: List inventory items
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
        - in: query
          name: sort
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: isActive
          schema:
            type: boolean
        - in: query
          name: minPrice
          schema:
            type: number
        - in: query
          name: maxPrice
          schema:
            type: number
        - in: query
          name: inStock
          schema:
            type: boolean
        - in: query
          name: lowStock
          schema:
            type: boolean
      responses:
        "200":
          description: Paged inventory items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedProducts"
    post:
      tags: [Inventory]
      summary: Create inventory item (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Item created
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    $ref: "#/components/schemas/Product"

  /categories:
    get:
      tags: [Inventory]
      summary: Get all categories
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items:
                      type: string

  /low-stock:
    get:
      tags: [Inventory]
      summary: Get low-stock items
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: threshold
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Low-stock items

  /sku/{sku}:
    get:
      tags: [Inventory]
      summary: Get item by SKU
      parameters:
        - in: path
          name: sku
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Item found

  /{id}:
    get:
      tags: [Inventory]
      summary: Get item by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Item found
    put:
      tags: [Inventory]
      summary: Update item (admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: Item updated
    delete:
      tags: [Inventory]
      summary: Delete item (admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Item deleted

  /{id}/stock:
    patch:
      tags: [Inventory]
      summary: Update stock (admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockUpdateRequest"
      responses:
        "200":
          description: Stock updated

  /{id}/transactions:
    get:
      tags: [Inventory]
      summary: Get transaction history
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Transaction history

  /{id}/availability:
    get:
      tags: [Inventory]
      summary: Check item availability
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: quantity
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Availability response

  /bulk-check-availability:
    post:
      tags: [Inventory]
      summary: Bulk check item availability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [id, quantity]
                    properties:
                      id:
                        type: string
                      quantity:
                        type: integer
                        minimum: 1
      responses:
        "200":
          description: Bulk availability response

  /cart:
    get:
      tags: [Cart]
      summary: Get customer cart
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cart returned
    post:
      tags: [Cart]
      summary: Add item to cart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddToCartRequest"
      responses:
        "200":
          description: Cart updated
    delete:
      tags: [Cart]
      summary: Clear cart
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cart cleared

  /cart/{itemId}:
    patch:
      tags: [Cart]
      summary: Update cart item quantity
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: itemId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCartItemRequest"
      responses:
        "200":
          description: Cart updated
    delete:
      tags: [Cart]
      summary: Remove item from cart
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: itemId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cart updated

  /wishlist:
    get:
      tags: [Wishlist]
      summary: Get customer wishlist
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Wishlist returned
    post:
      tags: [Wishlist]
      summary: Add item to wishlist
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddToWishlistRequest"
      responses:
        "200":
          description: Wishlist updated
    delete:
      tags: [Wishlist]
      summary: Clear wishlist
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Wishlist cleared

  /wishlist/check-wishlisted:
    post:
      tags: [Wishlist]
      summary: Check wishlisted status for multiple item IDs
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckWishlistedRequest"
      responses:
        "200":
          description: Wishlisted status returned

  /wishlist/{itemId}:
    delete:
      tags: [Wishlist]
      summary: Remove item from wishlist
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: itemId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Wishlist updated

  /orders:
    post:
      tags: [Orders]
      summary: Create order from cart
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Order created
    get:
      tags: [Orders]
      summary: Get customer orders
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Orders returned

  /orders/{orderId}:
    get:
      tags: [Orders]
      summary: Get order details
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order returned

  /orders/{orderId}/status:
    patch:
      tags: [Orders]
      summary: Update order status
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, paid, failed, cancelled, shipped, delivered]
      responses:
        "200":
          description: Order status updated

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Product:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
        sku:
          type: string
        price:
          type: number
        compareAtPrice:
          type: number
        stock:
          type: integer
        lowStockThreshold:
          type: integer
        unit:
          type: string
        images:
          type: array
          items:
            type: string
            format: uri
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateProductRequest:
      type: object
      required: [name, category, sku, price, stock, lowStockThreshold, unit]
      properties:
        name:
          type: string
        description:
          type: string
        category:
          type: string
        sku:
          type: string
        price:
          type: number
          minimum: 0
        compareAtPrice:
          type: number
          minimum: 0
        stock:
          type: integer
          minimum: 0
        lowStockThreshold:
          type: integer
          minimum: 0
        unit:
          type: string
        images:
          type: array
          items:
            type: string
            format: uri
        isActive:
          type: boolean

    UpdateProductRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        category:
          type: string
        price:
          type: number
          minimum: 0
        compareAtPrice:
          type: number
          minimum: 0
        stock:
          type: integer
          minimum: 0
        lowStockThreshold:
          type: integer
          minimum: 0
        unit:
          type: string
        images:
          type: array
          items:
            type: string
            format: uri
        isActive:
          type: boolean

    StockUpdateRequest:
      type: object
      required: [quantity, type]
      properties:
        quantity:
          type: integer
        type:
          type: string
          enum: [in, out, adjustment]
        reason:
          type: string
        reference:
          type: string
        notes:
          type: string

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    PaginatedProducts:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        pagination:
          $ref: "#/components/schemas/Pagination"

    AddToCartRequest:
      type: object
      required: [itemId, quantity]
      properties:
        itemId:
          type: string
        quantity:
          type: integer
          minimum: 1

    UpdateCartItemRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 0

    AddToWishlistRequest:
      type: object
      required: [itemId]
      properties:
        itemId:
          type: string

    CheckWishlistedRequest:
      type: object
      required: [itemIds]
      properties:
        itemIds:
          type: array
          minItems: 1
          items:
            type: string
